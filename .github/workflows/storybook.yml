# Publica Storybook en GitHub Pages cada vez que cambia main.
name: Publicar Storybook

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions de GitHub.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo una publicación a la vez: si llega un cambio nuevo mientras se
# publica otro, espera a que termine el anterior.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
